# backup-ops — YOUR personal selection (gitignored; generated by `start`/`onboard`)
# Written by the interactive wizard. Do not hand-edit unless you know the keys.
# Leave `selection` empty to use the catalog's `default_preset`.

language:
  output: en        # en | es | ...  (human-facing output)

# Pick ONE: a named preset from the catalog, OR the explicit `selection:` list
# (manual choice from the wizard). If selection is set, preset is ignored.
preset: essentials
selection: []        # e.g. ["documents","projects","dotfiles","secrets", ...]

# Destination drive/folder for the backup. An empty string = "ask at run time".
destination: ""

# Overrides platform autodetection if you need to force it (rare).
platform: auto       # auto | linux | windows | macos | wsl

# Headless mode: the wizard asks once, summarizes, and runs without re-asking.
auto_confirm: false