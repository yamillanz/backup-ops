# backup-ops — YOUR personal selection (gitignored; generated by `start`/`onboard`)
# Written by the interactive wizard. Do not hand-edit unless you know the keys.
# Leave `selection` empty to use the catalog's `default_preset`.

language:
  output: en        # en | es | ...  (human-facing output)

# Pick ONE: a named preset from the catalog, OR the explicit `selection:` list
# (manual choice from the wizard). If selection is set, preset is ignored.
preset: essentials
selection: []        # e.g. ["documents","projects","dotfiles","secrets", ...]

# Destination drive/folder for the backup. An empty string = "ask at run time".
destination: ""

# Overrides platform autodetection if you need to force it (rare).
platform: auto       # auto | linux | windows | macos | wsl

# Headless mode: the wizard asks once, summarizes, and runs without re-asking.
auto_confirm: false

# --- Migration profile (used by `start`, `backup`, `migrate`, `restore`) ------
# The video's core rule: origin and destination decide what is safe to carry.
# `auto` = detect from this machine. Set target.* when you already know the
# destination (e.g. Fedora 44 + KDE Plasma), or leave blank and let restore
# probe the new machine and write the comparison report.
migration:
  source:
    platform: auto       # auto | linux | windows | macos | wsl
    distro: auto         # auto = os-release ID (e.g. pop, arch, fedora)
    family: auto         # auto = debian | arch | fedora | suse | other
    desktop: auto        # auto = gnome | kde | cosmic | hyprland | ...
  target:
    platform: auto
    distro: ""           # e.g. fedora
    family: ""           # e.g. fedora
    desktop: ""          # e.g. kde
  restore_profile: safe  # safe (no DE) | same-de (only matching DE) | verbatim (danger)
  include_vm_disks: false # copy qcow2 disks; definitions are always inventoried
