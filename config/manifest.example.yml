# backup-ops configuration catalog
# -----------------------------------------------------------------------------
# DECLARATIVE + CROSS-PLATFORM: this file is the committed, generic catalog of
# everything that CAN be backed up. Each `source` has per-platform roots
# (linux / windows / macos / wsl) — so the same file works on any OS.
#
# What YOU personally selected (destination drive, migration source/target,
# which sources, preset) lives in config/user.yml (gitignored), generated by
# the `start` wizard. The backup root also carries a flat migration.yml so a
# restore host can compare origin vs destination without guessing.
#
# Source kinds:
#   dir      rsync mirror of a whole tree (big folders)
#   tar      single .tar.gz + sha256 (config/dotfile blobs)
#   drain    WAL-safe SQLite snapshots + rsync (browser profiles / history DBs)
#   snapshot generated files (system state, package/VM/container inventories,
#            AppImage scan, stray-file audit) — never a raw home copy
#
# Restore metadata (all optional):
#   restore_policy: always | same-de | manual | never
#     always  = restore automatically
#     same-de = restore only when source/target DE match and the user chose
#               the `same-de` (or `verbatim`) profile
#     manual  = copy to restore-manual/ + checklist; never write system paths
#     never   = informational only
#   restore_phase: 10 packages, 20 fonts/themes, 30 dotfiles/secrets,
#                  40 app/DE configs, 50 browsers, 60 data, 90 system/manual
#
# A source is available when it has a `platforms` root for the current
# platform. A root may be a `>`-separated candidate list (flatpak first):
# the first EXISTING candidate is backed up; restore never invents one.

platform: auto                 # auto | linux | windows | macos | wsl

default_preset: essentials     # used when config/user.yml has no explicit selection

default_destination: ""        # set via config/user.yml (the `start` wizard asks you)

# Named source groups.
presets:
  essentials:
    - documents
    - projects
    - desktop
    - pictures
    - videos
    - music
    - public
    - library_root
    - dotfiles
    - configs
    - desktop_env
    - local_bin_user
    - histories
    - secrets
    - fonts_user
    - themes
    - packages
    - snapshots
    - system_files
    - browsers
  full:
    - documents
    - projects
    - desktop
    - pictures
    - videos
    - music
    - public
    - library_root
    - downloads
    - appimages
    - dotfiles
    - configs
    - desktop_env
    - local_share
    - local_bin_user
    - local_bin_system
    - histories
    - secrets
    - fonts_user
    - fonts_system
    - fonts_system_local
    - themes
    - flatpak_data
    - gaming_steam
    - gaming_libraries
    - gaming_lutris_data
    - gaming_heroic_config
    - gaming_heroic_data
    - gaming_saves
    - packages
    - snapshots
    - system_files
    - network
    - virtualization
    - containers
    - audit
    - browsers
    - toolchains
  minimal:
    - documents
    - dotfiles
    - secrets
    - packages

# --- SOURCE CATALOG ----------------------------------------------------------
# Fields (all optional except id):
#   id        stable machine name
#   label     human name shown in the wizard
#   kind      dir | tar | drain | snapshot
#   enabled   true/false = pre-selected default in the wizard
#   dest      where it goes inside the backup root
#   platforms roots per OS (matching one is used at runtime)
#   exclude   optional exclusion patterns for this source (rsync/tar)
#   include_only  optional allow-list for tar staging
#   restore_policy / restore_phase  see header
sources:
  # --- user folders ----------------------------------------------------------
  - id: documents
    label: Documents
    kind: dir
    enabled: true
    dest: dirs/documents
    restore_phase: 60
    platforms:
      linux: "~/Documents"
      windows: "%USERPROFILE%/Documents"
      macos: "~/Documents"

  - id: projects
    label: Projects / code
    kind: dir
    enabled: true
    dest: dirs/projects
    restore_phase: 60
    platforms:
      linux: "~/Projects"
      windows: "%USERPROFILE%/Projects"
      macos: "~/Projects"
    exclude:
      - "node_modules"
      - "target"
      - "dist"
      - "build"
      - ".git"

  - id: desktop
    label: Desktop
    kind: dir
    enabled: true
    dest: dirs/desktop
    restore_phase: 60
    platforms:
      linux: "~/Desktop"
      windows: "%USERPROFILE%/Desktop"
      macos: "~/Desktop"

  - id: pictures
    label: Pictures / Imágenes
    kind: dir
    enabled: true
    dest: dirs/pictures
    restore_phase: 60
    platforms:
      linux: "~/Pictures"
      windows: "%USERPROFILE%/Pictures"
      macos: "~/Pictures"

  - id: videos
    label: Videos
    kind: dir
    enabled: true
    dest: dirs/videos
    restore_phase: 60
    platforms:
      linux: "~/Videos"
      windows: "%USERPROFILE%/Videos"
      macos: "~/Movies"

  - id: music
    label: Music
    kind: dir
    enabled: true
    dest: dirs/music
    restore_phase: 60
    platforms:
      linux: "~/Music"
      windows: "%USERPROFILE%/Music"
      macos: "~/Music"

  - id: public
    label: Public
    kind: dir
    enabled: true
    dest: dirs/public
    restore_phase: 60
    platforms:
      linux: "~/Public"
      windows: "%USERPROFILE%/Public"
      macos: "~/Public"

  - id: downloads
    label: Downloads
    kind: dir
    enabled: false               # big; only in `full` preset
    dest: dirs/downloads
    restore_phase: 60
    platforms:
      linux: "~/Downloads"
      windows: "%USERPROFILE%/Downloads"
      macos: "~/Downloads"

  - id: games
    label: Games (generic ~/Games)
    kind: dir
    enabled: false
    dest: dirs/games
    restore_phase: 60
    platforms:
      linux: "~/Games"
      windows: "%USERPROFILE%/Games"
      macos: "~/Games"

  - id: library_root
    label: Calibre library
    kind: dir
    enabled: true
    dest: dirs/calibre
    restore_phase: 60
    platforms:
      linux: "~/Calibre Library"
      windows: "%USERPROFILE%/Calibre Library"
      macos: "~/Calibre Library"

  # --- config + dotfiles -----------------------------------------------------
  - id: dotfiles
    label: Dotfiles (shell, git, tmux, prompt…)
    kind: tar
    enabled: true
    dest: configs/dotfiles
    restore_phase: 30
    platforms:
      linux: "~"
      windows: "%USERPROFILE%"
      macos: "~"
    exclude:
      - ".ssh"
      - ".gnupg"
      - ".cache"
      - ".config"
      - ".var"
      - ".local"
      - ".zsh_history"
      - ".bash_history"
      - "AppData"
      - "ntuser.dat*"
    include_only:
      - ".zshrc"
      - ".zshenv"
      - ".zprofile"
      - ".zlogin"
      - ".zlogout"
      - ".bashrc"
      - ".bash_profile"
      - ".bash_login"
      - ".bash_aliases"
      - ".bash_functions"
      - ".profile"
      - ".inputrc"
      - ".gitconfig"
      - ".gitignore_global"
      - ".tmux.conf"
      - ".tmux"
      - ".oh-my-zsh"
      - ".p10k.zsh"
      - ".pam_environment"
      - ".xinputrc"
      - ".npmrc"
      - ".pearrc"
      - ".wgetrc"
      - ".vimrc"
      - ".ideavimrc"
      - ".editorconfig"
      - ".tool-versions"

  - id: configs
    label: App configs (config home, DE-safe)
    kind: tar
    enabled: true
    dest: configs/configs
    restore_phase: 40
    platforms:
      linux: "~/.config"
      windows: "%APPDATA%"
      macos: "~/Library/Application Support"
    # DE state is backed up separately (desktop_env) and restored only on a
    # matching desktop; caches are disposable state, never migration payload.
    exclude:
      - "dconf"
      - "kdeglobals"
      - "plasmarc"
      - "kglobalshortcutsrc"
      - "kwinrc"
      - "kwinrulesrc"
      - "kscreenlockerrc"
      - "plasma-org.kde.plasma.desktop-appletsrc"
      - "cosmic"
      - "hypr"
      - "gnome-shell"
      - "gtk-3.0"
      - "gtk-4.0"
      - "qt5ct"
      - "qt6ct"
      - "xsettingsd"
      - "BraveSoftware"
      - "google-chrome"
      - "chromium"
      - "microsoft-edge"
      - "opera"
      - "vivaldi"
      - "zen"
      - "librewolf"
      - "heroic"
      - "lutris"
      - "Code/User/workspaceStorage"
      - "Code/logs"
      - "Code/CachedData"
      - "Windsurf/User/workspaceStorage"
      - "Cursor/User/workspaceStorage"
      - "thorium/Cache"
      - "chromium/Default/Cache"
      - "google-chrome/Default/Cache"
      - "Code/Cache"
      - "*/Cache"
      - "*ShaderCache*"
      - "*/GPUCache"
      - "*/DawnGraphiteCache"
      - "*/DawnWebGPUCache"

  - id: desktop_env
    label: Desktop environment state (DE-gated)
    kind: tar
    enabled: true
    dest: configs/desktop-env
    restore_policy: same-de
    restore_phase: 40
    platforms:
      linux: "~/.config"
      windows: ""
      macos: ""
    include_only:
      - "dconf"
      - "kdeglobals"
      - "plasmarc"
      - "kglobalshortcutsrc"
      - "kwinrc"
      - "kwinrulesrc"
      - "kscreenlockerrc"
      - "plasma-org.kde.plasma.desktop-appletsrc"
      - "cosmic"
      - "hypr"
      - "gnome-shell"
      - "gtk-3.0"
      - "gtk-4.0"
      - "qt5ct"
      - "qt6ct"
      - "xsettingsd"

  - id: local_share
    label: Local app data (selective)
    kind: tar
    enabled: false
    dest: configs/local-share
    restore_phase: 40
    platforms:
      linux: "~/.local/share"
      windows: "%LOCALAPPDATA%"
      macos: "~/Library/Application Support"
    include_only:
      - "keyrings"
      - "recently-used.xbel"
      - "TelegramDesktop"
      - "warp-terminal"
      - "torbrowser"

  - id: local_bin_user
    label: User binaries (~/.local/bin, ~/.local/sbin)
    kind: dir
    enabled: true
    dest: binaries/user
    restore_phase: 30
    platforms:
      linux: "~/.local/bin > ~/.local/sbin"
      windows: ""
      macos: ""

  - id: local_bin_system
    label: System-local binaries (/usr/local/bin, /usr/local/sbin)
    kind: dir
    enabled: false
    dest: binaries/system
    restore_policy: manual
    restore_phase: 90
    platforms:
      linux: "/usr/local/bin > /usr/local/sbin"
      windows: ""
      macos: ""

  - id: histories
    label: Shell & tool history (zsh/bash/fish…)
    kind: tar
    enabled: true
    dest: tool_histories
    restore_phase: 30
    platforms:
      linux: "~"
      windows: "%USERPROFILE%"
      macos: "~"
    include_only:
      - ".zsh_history"
      - ".bash_history"
      - ".python_history"
      - ".mysql_history"
      - ".psql_history"
      - ".sqlite_history"
      - ".irb_history"
      - ".wget-hsts"
      - ".viminfo"
      - ".lesshst"
      - ".node_repl_history"
      - ".local/share/fish/fish_history"

  # --- secrets ---------------------------------------------------------------
  - id: secrets
    label: Secrets (SSH + GPG)
    kind: tar
    enabled: true
    dest: secrets
    restore_phase: 30
    platforms:
      linux: "~"
      windows: "%USERPROFILE%"
      macos: "~"
    include_only:
      - ".ssh"
      - ".gnupg"
      - ".password-store"

  # --- fonts, themes, desktop appearance -------------------------------------
  - id: fonts_user
    label: User fonts
    kind: dir
    enabled: true
    dest: fonts/user
    restore_phase: 20
    platforms:
      linux: "~/.local/share/fonts > ~/.fonts"
      windows: "%LOCALAPPDATA%/Microsoft/Windows/Fonts"
      macos: "~/Library/Fonts"
    exclude:
      - "*.tmp"
      - ".uuid"

  - id: fonts_system
    label: System fonts (/usr/share)
    kind: dir
    enabled: false
    dest: fonts/system
    restore_policy: manual
    restore_phase: 20
    platforms:
      linux: "/usr/share/fonts"
      windows: ""
      macos: ""

  - id: fonts_system_local
    label: Local system fonts (/usr/local/share)
    kind: dir
    enabled: false
    dest: fonts/system-local
    restore_policy: manual
    restore_phase: 20
    platforms:
      linux: "/usr/local/share/fonts"
      windows: ""
      macos: ""

  - id: themes
    label: Themes, icons, cursors
    kind: dir
    enabled: true
    dest: themes
    restore_phase: 20
    platforms:
      linux: "~/.local/share/themes > ~/.themes > ~/.local/share/icons > ~/.icons"
      windows: ""
      macos: "~/Library/Themes"

  - id: flatpak_data
    label: Flatpak app data (cache-free)
    kind: dir
    enabled: false
    dest: configs/flatpak-data
    restore_phase: 40
    platforms:
      linux: "~/.var/app"
      windows: ""
      macos: ""
    exclude:
      - "cache"
      - "Cache"
      - "tmp"
      - "org.mozilla.firefox"
      - "org.chromium.Chromium"
      - "com.brave.Browser"
      - "com.google.Chrome"
      - "com.microsoft.Edge"
      - "com.opera.Opera"
      - "com.vivaldi.Vivaldi"
      - "app.zen_browser.zen"
      - "io.gitlab.librewolf-community"
      - "com.valvesoftware.Steam"
      - "net.lutris.Lutris"
      - "com.heroicgameslauncher.hgl"
      - "*/cache"
      - "*/Cache"
      - "*/tmp"
      - "*/ShaderCache"
      - "*/GPUCache"
      - "*/DawnGraphiteCache"
      - "*/DawnWebGPUCache"
      - "*/logs"
      - "*/log"

  # --- browser profiles (drain: history-safe) --------------------------------
  - id: browsers
    label: All browser profiles + history
    kind: drain
    enabled: true
    dest: browsers
    restore_policy: always
    restore_phase: 50
    platforms:
      linux: "~"
      windows: "%USERPROFILE%"
      macos: "~"
    # Candidate lists: flatpak path first, native fallback. The first existing
    # root is backed up; restore uses an existing target root only.
    browsers:
      firefox:
        linux: "~/.var/app/org.mozilla.firefox/.mozilla/firefox > ~/.mozilla/firefox"
        windows: "%APPDATA%/Mozilla/Firefox/Profiles"
        macos: "~/Library/Application Support/Firefox/Profiles"
        exclude: ["*-parent.lock", "*.lz4"]
      chromium:
        linux: "~/.var/app/org.chromium.Chromium/config/chromium > ~/.config/chromium"
        windows: "%LOCALAPPDATA%/Chromium/User Data"
        macos: "~/Library/Application Support/Chromium"
        exclude: ["GrShaderCache", "ShaderCache", "GPUCache", "DawnGraphiteCache", "DawnWebGPUCache", "component_crx_cache", "extensions_crx_cache"]
      brave:
        linux: "~/.var/app/com.brave.Browser/config/BraveSoftware/Brave-Browser > ~/.config/BraveSoftware/Brave-Browser"
        windows: "%LOCALAPPDATA%/BraveSoftware/Brave-Browser/User Data"
        macos: "~/Library/Application Support/BraveSoftware/Brave-Browser"
        exclude: ["Shipping", "GrShaderCache", "ShaderCache", "GPUCache", "DawnGraphiteCache", "DawnWebGPUCache", "component_crx_cache", "extensions_crx_cache"]
      chrome:
        linux: "~/.var/app/com.google.Chrome/config/google-chrome > ~/.config/google-chrome"
        windows: "%LOCALAPPDATA%/Google/Chrome/User Data"
        macos: "~/Library/Application Support/Google/Chrome"
        exclude: ["GrShaderCache", "ShaderCache", "GPUCache", "DawnGraphiteCache", "DawnWebGPUCache", "component_crx_cache", "extensions_crx_cache"]
      edge:
        linux: "~/.var/app/com.microsoft.Edge/config/microsoft-edge > ~/.config/microsoft-edge"
        windows: "%LOCALAPPDATA%/Microsoft/Edge/User Data"
        macos: "~/Library/Application Support/Microsoft Edge"
        exclude: ["GrShaderCache", "ShaderCache", "GPUCache", "component_crx_cache", "extensions_crx_cache"]
      opera:
        linux: "~/.var/app/com.opera.Opera/config/opera > ~/.config/opera"
        windows: "%APPDATA%/Opera Software/Opera Stable"
        macos: "~/Library/Application Support/com.operasoftware.Opera"
        exclude: ["ShaderCache", "GPUCache"]
      vivaldi:
        linux: "~/.var/app/com.vivaldi.Vivaldi/config/vivaldi > ~/.config/vivaldi"
        windows: "%LOCALAPPDATA%/Vivaldi/User Data"
        macos: "~/Library/Application Support/Vivaldi"
        exclude: ["GrShaderCache", "ShaderCache", "GPUCache", "component_crx_cache", "extensions_crx_cache"]
      zen:
        linux: "~/.var/app/app.zen_browser.zen/.zen > ~/.zen"
        windows: ""
        macos: "~/Library/Application Support/Zen"
        exclude: ["*.lz4"]
      librewolf:
        linux: "~/.var/app/io.gitlab.librewolf-community/.librewolf > ~/.librewolf"
        windows: "%APPDATA%/LibreWolf/Profiles"
        macos: "~/Library/Application Support/LibreWolf/Profiles"
        exclude: ["*.lz4"]

  # --- gaming ----------------------------------------------------------------
  - id: gaming_steam
    label: Steam library (steamapps)
    kind: dir
    enabled: false
    dest: gaming/steam
    restore_phase: 60
    platforms:
      linux: "~/.var/app/com.valvesoftware.Steam/.local/share/Steam/steamapps > ~/.local/share/Steam/steamapps > ~/.steam/steam/steamapps"
      windows: "%PROGRAMFILES(X86)%/Steam/steamapps"
      macos: "~/Library/Application Support/Steam/steamapps"
    exclude:
      - "downloading"
      - "temp"
      - "shadercache"
      - "appcache"

  - id: gaming_libraries
    label: Lutris/Heroic game libraries (~/Games)
    kind: dir
    enabled: false
    dest: gaming/libraries
    restore_phase: 60
    platforms:
      linux: "~/Games"
      windows: "%USERPROFILE%/Games"
      macos: "~/Games"

  - id: gaming_lutris_data
    label: Lutris metadata/library database
    kind: dir
    enabled: false
    dest: gaming/lutris-data
    restore_phase: 60
    platforms:
      linux: "~/.local/share/lutris > ~/.var/app/net.lutris.Lutris/data/lutris"
      windows: ""
      macos: ""

  - id: gaming_heroic_config
    label: Heroic config (credentials, library list)
    kind: dir
    enabled: false
    dest: gaming/heroic-config
    restore_phase: 60
    platforms:
      linux: "~/.config/heroic > ~/.var/app/com.heroicgameslauncher.hgl/config/heroic"
      windows: "%APPDATA%/heroic"
      macos: "~/Library/Application Support/heroic"

  - id: gaming_heroic_data
    label: Heroic runners data (Wine/Proton state)
    kind: dir
    enabled: false
    dest: gaming/heroic-data
    restore_phase: 60
    platforms:
      linux: "~/.var/app/com.heroicgameslauncher.hgl/data > ~/.local/share/heroic"
      windows: ""
      macos: ""

  - id: gaming_saves
    label: Save games (Ludusavi)
    kind: snapshot
    enabled: false
    dest: gaming/saves
    restore_policy: manual
    restore_phase: 60
    platforms:
      linux: ""
      windows: "%USERPROFILE%"
      macos: "~"

  - id: appimages
    label: AppImages (scan whole system)
    kind: snapshot
    enabled: false
    dest: portable/appimages
    restore_policy: manual
    restore_phase: 60
    platforms:
      linux: ""
      windows: ""
      macos: ""

  # --- package + system state ------------------------------------------------
  - id: packages
    label: Package inventory (native, AUR, Flatpak, Snap)
    kind: snapshot
    enabled: true
    dest: packages
    restore_policy: manual
    restore_phase: 10
    platforms:
      linux: ""
      windows: "%USERPROFILE%"
      macos: "~"

  - id: snapshots
    label: System state (versions, fstab, units, cron, mounts)
    kind: snapshot
    enabled: true
    dest: system-state
    restore_policy: manual
    restore_phase: 90
    platforms:
      linux: ""
      windows: "%USERPROFILE%"
      macos: "~"

  - id: system_files
    label: Selected /etc files (manual restore)
    kind: snapshot
    enabled: true
    dest: system-files
    restore_policy: manual
    restore_phase: 90
    platforms:
      linux: ""
      windows: ""
      macos: ""

  - id: network
    label: NetworkManager profiles + VPN/WiFi state
    kind: snapshot
    enabled: false
    dest: network
    restore_policy: manual
    restore_phase: 90
    platforms:
      linux: ""
      windows: ""
      macos: ""

  - id: virtualization
    label: KVM/VirtualBox definitions + disk inventory
    kind: snapshot
    enabled: false
    dest: virtualization
    restore_policy: manual
    restore_phase: 90
    platforms:
      linux: ""
      windows: ""
      macos: ""

  - id: containers
    label: Docker/Podman inventory + compose files
    kind: snapshot
    enabled: false
    dest: containers
    restore_policy: manual
    restore_phase: 90
    platforms:
      linux: ""
      windows: ""
      macos: ""

  - id: audit
    label: Stray files audit (report only)
    kind: snapshot
    enabled: false
    dest: audit
    restore_policy: never
    restore_phase: 90
    platforms:
      linux: ""
      windows: ""
      macos: ""

  # --- toolchains (info only) -------------------------------------------------
  - id: toolchains
    label: Toolchain locations (info, re-installed not restored)
    kind: snapshot
    enabled: false
    dest: system-state/toolchains
    restore_policy: never
    restore_phase: 90
    platforms:
      linux: "~/.nvm > ~/.rustup > ~/.cargo > ~/.sdkman > ~/go > ~/.bun > ~/.npm"
      windows: ""
      macos: "~/.nvm > ~/.rustup > ~/.cargo > ~/go"

# -----------------------------------------------------------------------------
# Global safety knobs (can be overridden via config/user.yml)
safety:
  dry_run_first: true
  never_delete: true
  confirm_before_overwrite: true
  require_free_space_check: true
  free_space_min_gb: 30
  min_free_percent: 10
  max_section_retries: 1
  restore_to_home_only: true
  stray_timeout_seconds: 120
  appimage_timeout_seconds: 120
