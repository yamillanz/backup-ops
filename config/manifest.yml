# backup-ops configuration catalog
# -----------------------------------------------------------------------------
# DECLARATIVE + CROSS-PLATFORM: this file is the committed, generic catalog of
# everything that CAN be backed up. Each `source` has per-platform roots
# (linux / windows / macos / wsl) — so the same file works on any OS.
#
# What YOU personally selected (destination drive, which sources, preset)
# lives in config/user.yml (gitignored), generated by the `start` wizard.
#
# Source kinds:
#   dir      rsync mirror of a whole tree (big folders)
#   tar      single .tar.gz + sha256 (config/dotfile blobs)
#   drain    WAL-safe SQLite snapshots + rsync (browser profiles / history DBs)
#   snapshot generated text files (system state)
#
# A source is available when it has a `platforms` root for the current platform.

platform: auto                 # auto | linux | windows | macos | wsl

default_preset: essentials     # used when config/user.yml has no explicit selection

default_destination: ""        # set via config/user.yml (the `start` wizard asks you)

# Named source groups. `presets:` on each source lists which groups include it.
presets:
  essentials:
    - documents
    - projects
    - desktop
    - pictures
    - videos
    - music
    - public
    - library_root
    - dotfiles
    - configs
    - histories
    - secrets
    - snapshots
    - browsers
  full:
    - documents
    - projects
    - desktop
    - pictures
    - videos
    - music
    - public
    - library_root
    - downloads
    - games
    - appimages
    - dotfiles
    - configs
    - local_share
    - histories
    - secrets
    - snapshots
    - browsers
    - toolchains
  minimal:
    - documents
    - dotfiles
    - secrets

# --- SOURCE CATALOG ----------------------------------------------------------
# Fields (all optional except id):
#   id        stable machine name
#   label     human name shown in the wizard
#   kind      dir | tar | drain | snapshot
#   enabled   true/false = pre-selected default in the wizard
#   dest      where it goes inside the backup root
#   platforms roots per OS (the matching one is used at runtime)
#   exclude   optional extra exclusion patterns for this source (rsync/tar)
sources:
  # --- user folders ----------------------------------------------------------
  - id: documents
    label: Documents
    kind: dir
    enabled: true
    dest: dirs/documents
    platforms:
      linux: "~/Documents"
      windows: "%USERPROFILE%/Documents"
      macos: "~/Documents"

  - id: projects
    label: Projects / code
    kind: dir
    enabled: true
    dest: dirs/projects
    platforms:
      linux: "~/Projects"
      windows: "%USERPROFILE%/Projects"
      macos: "~/Projects"
    exclude:
      - "node_modules"
      - "target"
      - "dist"
      - "build"
      - ".git"

  - id: desktop
    label: Desktop
    kind: dir
    enabled: true
    dest: dirs/desktop
    platforms:
      linux: "~/Desktop"
      windows: "%USERPROFILE%/Desktop"
      macos: "~/Desktop"

  - id: pictures
    label: Pictures / Imágenes
    kind: dir
    enabled: true
    dest: dirs/pictures
    platforms:
      linux: "~/Pictures"
      windows: "%USERPROFILE%/Pictures"
      macos: "~/Pictures"

  - id: videos
    label: Videos
    kind: dir
    enabled: true
    dest: dirs/videos
    platforms:
      linux: "~/Videos"
      windows: "%USERPROFILE%/Videos"
      macos: "~/Movies"

  - id: music
    label: Music
    kind: dir
    enabled: true
    dest: dirs/music
    platforms:
      linux: "~/Music"
      windows: "%USERPROFILE%/Music"
      macos: "~/Music"

  - id: public
    label: Public
    kind: dir
    enabled: true
    dest: dirs/public
    platforms:
      linux: "~/Public"
      windows: "%USERPROFILE%/Public"
      macos: "~/Public"

  - id: downloads
    label: Downloads
    kind: dir
    enabled: false               # big; only in `full` preset
    dest: dirs/downloads
    platforms:
      linux: "~/Downloads"
      windows: "%USERPROFILE%/Downloads"
      macos: "~/Downloads"

  - id: games
    label: Games
    kind: dir
    enabled: false
    dest: dirs/games
    platforms:
      linux: "~/Games"
      windows: "%USERPROFILE%/Games"
      macos: "~/Games"

  - id: appimages
    label: AppImages / portable apps
    kind: dir
    enabled: false
    dest: dirs/appimages
    platforms:
      linux: "~/AppImages"
      windows: ""
      macos: ""

  - id: library_root
    label: Calibre library
    kind: dir
    enabled: true
    dest: dirs/calibre
    platforms:
      linux: "~/Calibre Library"
      windows: "%USERPROFILE%/Calibre Library"
      macos: "~/Calibre Library"

  # --- config + dotfiles -----------------------------------------------------
  - id: dotfiles
    label: Dotfiles (shell, git, tmux, npmrc…)
    kind: tar
    enabled: true
    dest: configs/dotfiles
    platforms:
      linux: "~"
      windows: "%USERPROFILE%"
      macos: "~"
    exclude:
      - ".ssh"
      - ".gnupg"
      - ".cache"
      - ".config"
      - ".var"
      - ".local"
      - ".zsh_history"
      - ".bash_history"
      - "AppData"
      - "ntuser.dat*"
    include_only:
      - ".zshrc"
      - ".zshenv"
      - ".bashrc"
      - ".bash_profile"
      - ".profile"
      - ".gitconfig"
      - ".gitignore_global"
      - ".tmux.conf"
      - ".tmux"
      - ".oh-my-zsh"
      - ".pam_environment"
      - ".xinputrc"
      - ".npmrc"
      - ".pearrc"
      - ".wgetrc"

  - id: configs
    label: App configs (config home)
    kind: tar
    enabled: true
    dest: configs/configs
    platforms:
      linux: "~/.config"
      windows: "%APPDATA%"
      macos: "~/Library/Application Support"
    exclude:
      - "Code/User/workspaceStorage"
      - "Code/logs"
      - "Code/CachedData"
      - "Windsurf/User/workspaceStorage"
      - "Cursor/User/workspaceStorage"
      - "thorium/Cache"
      - "chromium/Default/Cache"
      - "google-chrome/Default/Cache"
      - "Code/Cache"
      - "*/Cache"
      - "*ShaderCache*"

  - id: local_share
    label: Local app data (selective)
    kind: tar
    enabled: false
    dest: configs/local-share
    platforms:
      linux: "~/.local/share"
      windows: "%LOCALAPPDATA%"
      macos: "~/Library/Application Support"
    include_only:
      - "keyrings"
      - "recently-used.xbel"
      - "TelegramDesktop"
      - "warp-terminal"
      - "torbrowser"

  - id: histories
    label: Shell & tool history (zsh/bash history…)
    kind: tar
    enabled: true
    dest: tool_histories
    platforms:
      linux: "~"
      windows: "%USERPROFILE%"
      macos: "~"
    include_only:
      - ".zsh_history"
      - ".bash_history"
      - ".python_history"
      - ".mysql_history"
      - ".psql_history"
      - ".wget-hsts"
      - ".viminfo"
      - ".lesshst"
      - ".node_repl_history"

  # --- secrets ---------------------------------------------------------------
  - id: secrets
    label: Secrets (SSH + GPG)
    kind: tar
    enabled: true
    dest: secrets
    platforms:
      linux: "~"
      windows: "%USERPROFILE%"
      macos: "~"
    include_only:
      - ".ssh"
      - ".gnupg"

  # --- browser profiles (drain: history-safe) --------------------------------
  - id: browsers
    label: All browser profiles + history
    kind: drain
    enabled: true
    dest: browsers
    platforms:
      linux: "~"
      windows: "%USERPROFILE%"
      macos: "~"
    # Windows/Linux/macOS browser profile globs are resolved per platform:
    browsers:
      firefox:
        linux: "~/.mozilla/firefox"
        windows: "%APPDATA%/Mozilla/Firefox/Profiles"
        macos: "~/Library/Application Support/Firefox/Profiles"
        exclude: ["*-parent.lock", "*.lz4"]
      brave:
        linux: "~/.var/app/com.brave.Browser/config/BraveSoftware/Brave-Browser"
        windows: "%LOCALAPPDATA%/BraveSoftware/Brave-Browser/User Data"
        macos: "~/Library/Application Support/BraveSoftware/Brave-Browser"
        exclude: ["Shipping", "GrShaderCache", "ShaderCache", "GPUCache", "DawnGraphiteCache", "DawnWebGPUCache", "component_crx_cache", "extensions_crx_cache"]
      chrome:
        linux: "~/.var/app/com.google.Chrome/config/google-chrome"
        windows: "%LOCALAPPDATA%/Google/Chrome/User Data"
        macos: "~/Library/Application Support/Google/Chrome"
        exclude: ["GrShaderCache", "ShaderCache", "GPUCache", "DawnGraphiteCache", "DawnWebGPUCache", "component_crx_cache", "extensions_crx_cache"]
      edge:
        linux: "~/.var/app/com.microsoft.Edge/config/microsoft-edge"
        windows: "%LOCALAPPDATA%/Microsoft/Edge/User Data"
        macos: "~/Library/Application Support/Microsoft Edge"
        exclude: ["GrShaderCache", "ShaderCache", "GPUCache", "component_crx_cache", "extensions_crx_cache"]
      opera:
        linux: "~/.var/app/com.opera.Opera/config/opera"
        windows: "%APPDATA%/Opera Software/Opera Stable"
        macos: "~/Library/Application Support/com.operasoftware.Opera"
        exclude: ["ShaderCache", "GPUCache"]
      vivaldi:
        linux: "~/.var/app/com.vivaldi.Vivaldi/config/vivaldi"
        windows: "%LOCALAPPDATA%/Vivaldi/User Data"
        macos: "~/Library/Application Support/Vivaldi"
        exclude: ["GrShaderCache", "ShaderCache", "GPUCache", "component_crx_cache", "extensions_crx_cache"]
      zen:
        linux: "~/.var/app/app.zen_browser.zen/.zen"
        windows: ""
        macos: "~/Library/Application Support/Zen"
        exclude: ["*.lz4"]
      librewolf:
        linux: "~/.var/app/io.gitlab.librewolf-community/.librewolf"
        windows: "%APPDATA%/LibreWolf/Profiles"
        macos: "~/Library/Application Support/LibreWolf/Profiles"
        exclude: ["*.lz4"]

  # --- system state (snapshot: generated files) ------------------------------
  - id: snapshots
    label: System state (packages, flatpaks, fstab, units)
    kind: snapshot
    enabled: true
    dest: system-state
    platforms:
      linux: ""
      windows: "%USERPROFILE%"
      macos: "~"

  # --- toolchains (info only) -------------------------------------------------
  - id: toolchains
    label: Toolchain locations (info, re-installed not restored)
    kind: snapshot
    enabled: false
    dest: system-state/toolchains
    platforms:
      linux: "~/.nvm > ~/.rustup > ~/.cargo > ~/.sdkman > ~/go > ~/.bun > ~/.npm"
      windows: ""
      macos: "~/.nvm > ~/.rustup > ~/.cargo > ~/go"

# -----------------------------------------------------------------------------
# Global safety knobs (can be overridden via config/user.yml)
safety:
  dry_run_first: true
  never_delete: true
  confirm_before_overwrite: true
  require_free_space_check: true
  free_space_min_gb: 30
  max_section_retries: 1
  restore_to_home_only: true